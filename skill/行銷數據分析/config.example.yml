# 行銷數據分析 Skill — 機器設定
#
# 這份是範本。第一次在新機器上使用時：
#     cp config.example.yml config.yml
# 然後依你的環境修改 config.yml。config.yml 不進版控，所以你的路徑不會污染別人。
#
# 沒有 config.yml 時，scripts/paths.py 會用下面這些預設值 —— 多數情況直接能跑。

# ── 專案存放位置 ─────────────────────────────────────────
# 分析專案放哪。可用 ~ 開頭，也可用環境變數 ${VAR}。
# 預設：skill 資料夾旁邊的 projects/
專案根目錄: null

# ── 素材庫（選填）─────────────────────────────────────────
# 方法論 digest 的位置。要查「這條規則的出處」時會用到。
# 沒有也不影響 Skill 運作，只是查不到出處。
素材庫: null

# ── Python 環境 ──────────────────────────────────────────
python:
  # 因果推論次環境（dowhy / EconML / causalml / meridian）
  # 主環境 Python 3.14 裝 dowhy 會靜默降版到 2022 年的 0.8 版，所以必須分開。
  次環境路徑: ".venv-causal"
  次環境版本: "3.12"

# ── 資料倉儲 ─────────────────────────────────────────────
duckdb:
  檔名: "warehouse.duckdb"
  執行緒: 6
  記憶體上限: "11GB"
  # 暫存目錄。放在資料所在的實體磁碟，不要放網路磁碟機。
  暫存目錄: null

# ── 字型 ─────────────────────────────────────────────────
# 本機產出用系統字型；對外散布且需嵌入時自動切成開源字型。
字型:
  中文: "Microsoft JhengHei"
  英文: "Times New Roman"
  對外散布備援: "Noto Sans TC"     # OFL 授權，可自由嵌入
  最小字級: 12

# ── 選填工具 ─────────────────────────────────────────────
工具:
  R路徑: null          # 只有要跑 R 對照驗算時才需要
  pandoc: null         # 讀 .docx 用；null 表示用 PATH 上的
  quarto: null         # 目前不使用，保留欄位
